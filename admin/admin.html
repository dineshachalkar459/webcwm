<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChargeWave Media Admin</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <div class="admin-shell">
      <div class="login-card">
        <div class="brand">
          <span class="brand-main">ChargeWave</span>
          <span class="brand-accent">Media</span>
        </div>
        <h2>Company Login</h2>
        <form id="adminLoginForm">
          <label>
            <span>User ID</span>
            <input type="text" id="userId" placeholder="Enter ID" required />
          </label>
          <label>
            <span>Password</span>
            <input type="password" id="password" placeholder="Enter Password" required />
          </label>
          <button type="submit" class="btn primary">Secure Login</button>
        </form>
      </div>
    </div>

    <script src="js/admin.js"></script>
  </body>
</html>
